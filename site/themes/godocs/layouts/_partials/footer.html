<footer class="footer">
  <div class="footer-inner">
    <div>
      <a class="brand" href="{{ "/" | relURL }}"><img src="{{ "favicon.svg" | relURL }}" alt="" width="22" height="22"><span>{{ site.Title }}</span></a>
      <p class="muted">{{ site.Params.tagline }}.{{ with site.Params.license }} Open source under the {{ . }} License.{{ end }}</p>
    </div>
    <nav aria-label="Footer">
      <a href="{{ "/docs/latest/" | relURL }}">Documentation</a>
      <a href="{{ "/changelog/" | relURL }}">Changelog</a>
      <a href="{{ site.Params.repo }}">GitHub</a>
      <a href="{{ site.Params.repo }}/releases">Releases</a>
      {{- range site.Params.related }}
      <a href="{{ .url }}" title="{{ .note }}">{{ .name }}</a>
      {{- end }}
    </nav>
  </div>
</footer>
