name: gofilament_admin
description: Schema-driven Flutter admin client for GoFilament panels. Lists, forms, dashboards, theming and branding are rendered from the panel API.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  archive: ^4.0.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
